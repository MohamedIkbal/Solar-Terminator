# Configuration parameters for mearm_hand_tracking_node
mearm_hand_tracking_node:
  ros__parameters:
    camera_index: 4  # index 0 is the Surface's IR/Windows-Hello sensor (no usable
                     # color image); the actual RGB "Integrated Camera" is index 4
                     # on this machine (confirmed via /sys/class/video4linux/*/name)
    frame_width: 640
    frame_height: 480
    publish_rate_hz: 15.0
    min_hand_area: 3000.0
    max_hand_area: 45000.0
    smoothing_alpha: 0.25
    show_debug_windows: true
    mirror_camera: true
    hand_lost_timeout_ms: 800
    # Default HSV skin-color range (tune live with the on-screen "Controls"
    # trackbars for your lighting/skin tone, then copy the values back here).
    h_min: 0
    h_max: 20
    s_min: 30
    s_max: 150
    v_min: 60
    v_max: 255
